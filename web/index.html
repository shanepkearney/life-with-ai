<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Conway's Game of Life with GPU shader glow and an AI assistant that designs, tests and replays seeds.">
  <meta name="theme-color" content="#05060A">

  <!-- Link previews (Open Graph + Twitter card). Crawlers read only this static
       HTML, never the Flutter app, and require ABSOLUTE URLs for the image.
       Regenerate the image with tool/social_card.swift. -->
  <link rel="canonical" href="https://shanepkearney.github.io/life-with-ai/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Life with AI">
  <meta property="og:title" content="Life with AI">
  <meta property="og:description" content="Conway's Game of Life with GPU shader glow, and an AI that designs, tests and replays seeds for you. Describe what you want to see and watch Claude build it.">
  <meta property="og:url" content="https://shanepkearney.github.io/life-with-ai/">
  <meta property="og:image" content="https://shanepkearney.github.io/life-with-ai/social-preview.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A glowing four-pointed star of Game of Life cells designed by Claude, beside the title Life with AI">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Life with AI">
  <meta name="twitter:description" content="Conway's Game of Life with GPU shader glow, and an AI that designs, tests and replays seeds for you.">
  <meta name="twitter:image" content="https://shanepkearney.github.io/life-with-ai/social-preview.jpg">
  <meta name="twitter:image:alt" content="A glowing four-pointed star of Game of Life cells designed by Claude, beside the title Life with AI">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Life with AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Life with AI</title>
  <link rel="manifest" href="manifest.json">

  <!-- ANALYTICS: the Pages build replaces this line with the Cloudflare Web
       Analytics beacon (cookieless). Local builds leave it as a comment. -->
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
