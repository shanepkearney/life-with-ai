name: Test and deploy

# Both test suites must pass before anything reaches the live site.
# Pull requests run the tests too, but never deploy.
#
# Every deploy is a semantic version, decided from the commits since the last
# release tag by tool/next_version.dart (feat → minor, fix and the rest → patch,
# `!` or BREAKING CHANGE → major). The version and commit are compiled into the
# app for its about panel, and once the deploy succeeds the commit is tagged
# v<version> with a GitHub Release (notes from tool/release_notes.dart), so a
# failed deploy never uses up a number. Each release carries the macOS app as
# Life-with-AI.dmg, so …/releases/latest/download/Life-with-AI.dmg is always
# the newest.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.5

jobs:
  unit:
    name: Unit and widget tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  integration:
    name: Integration tests (macOS app)
    # The real app end to end: Metal shaders, isolate, storage, clipboard.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test integration_test -d macos

  web:
    name: Web tests (Chrome)
    # The web build in a real browser: page address, browser downloads, Mac
    # detection, shaders under the browser's renderer. Everything else runs the
    # macOS app above. The runner comes with Chrome and a matching ChromeDriver.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: |
          "$CHROMEWEBDRIVER/chromedriver" --port=4444 > chromedriver.log 2>&1 &
          for _ in $(seq 1 20); do curl -fs http://localhost:4444/status >/dev/null && exit 0; sleep 0.5; done
          cat chromedriver.log; exit 1
      - run: >-
          flutter drive --release -d web-server --browser-name=chrome
          --driver=test_driver/integration_test.dart
          --target=integration_test/web_flows.dart

  version:
    name: Decide the version
    needs: [unit, integration, web]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      commit: ${{ steps.next.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every commit and tag since the last release
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - id: next
        run: |
          # Plain `dart`, not `dart run`, which prints build progress into the output.
          dart tool/next_version.dart | tee -a "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short=7 HEAD)" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build web
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Pages serves the site from /<repo>/, so assets must resolve under that path.
      - run: >-
          flutter build web --release --base-href /life-with-ai/
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ github.run_number }}
          --dart-define=APP_VERSION=${{ needs.version.outputs.version }}
          --dart-define=APP_COMMIT=${{ needs.version.outputs.commit }}
      # Cloudflare Web Analytics, on the live site only (local builds never
      # count). The token is public by design: it's in every page's source.
      - env:
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
        run: |
          if [ -z "$CF_BEACON_TOKEN" ]; then
            echo "::warning::CF_BEACON_TOKEN is not set; deploying without analytics."
            exit 0
          fi
          case "$CF_BEACON_TOKEN" in *[!A-Za-z0-9]*) echo "::error::CF_BEACON_TOKEN should be letters and digits only."; exit 1;; esac
          # Cloudflare's own snippet, as its dashboard gives it.
          beacon="<script type=\"module\" src=\"https://static.cloudflareinsights.com/beacon.min.js\" data-cf-beacon='{\"token\": \"$CF_BEACON_TOKEN\"}'></script>"
          python3 - "$beacon" <<'PY'
          import re, sys
          path = 'build/web/index.html'
          html = open(path).read()
          new, n = re.subn(r'  <!-- ANALYTICS:.*?-->', '  ' + sys.argv[1], html, flags=re.S)
          assert n == 1, 'the ANALYTICS placeholder is missing from web/index.html'
          open(path, 'w').write(new)
          PY
          grep -c cloudflareinsights build/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  macos:
    name: Build the macOS app
    needs: [unit, integration, web, version]
    # Pull requests build it too, so a broken DMG shows up before merging; only
    # releases ship one. (`!cancelled()` lets it run on PRs, where `version` is skipped.)
    if: >-
      !cancelled() && needs.unit.result == 'success' && needs.integration.result == 'success'
      && needs.web.result == 'success'
      && (github.event_name == 'pull_request' || needs.version.outputs.tag == 'true')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # A universal (Apple silicon + Intel) app, carrying the same version and
      # commit as the web build. Ad-hoc signed only: no Developer ID yet.
      - run: >-
          flutter build macos --release
          --build-name=${{ needs.version.outputs.version || '0.0.0' }}
          --build-number=${{ github.run_number }}
          --dart-define=APP_VERSION=${{ needs.version.outputs.version }}
          --dart-define=APP_COMMIT=${{ needs.version.outputs.commit }}
      - run: tool/make_dmg.sh "build/macos/Build/Products/Release/Life with AI.app" Life-with-AI.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: Life-with-AI.dmg
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Tag the release
    # The DMG rides along, so the download link works the moment the release exists.
    needs: [version, deploy, macos]
    # A re-run with nothing new since the last tag has nothing to tag.
    if: needs.version.outputs.tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the notes cover every commit since the last release
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Notes grouped from the commits (tool/release_notes.dart), under the
      # version's hand-written intro in .github/releases/ when there is one.
      - run: dart tool/release_notes.dart "${{ needs.version.outputs.version }}" > notes.md
      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v${{ needs.version.outputs.version }}"
          --repo "${{ github.repository }}"
          --target "${{ github.sha }}"
          --title "v${{ needs.version.outputs.version }}"
          --notes-file notes.md
          Life-with-AI.dmg

  smoke:
    name: Check the live site
    # After every deploy, from the outside: the site serves this build, with the
    # analytics beacon; after a release, its page and the macOS download work.
    needs: [version, deploy, release]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          tool/smoke_live.sh "${{ needs.version.outputs.commit }}"
          "${{ needs.version.outputs.version }}" "${{ needs.release.result == 'success' }}"
