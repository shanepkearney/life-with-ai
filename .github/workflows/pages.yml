name: Test and deploy

# Both test suites must pass before anything reaches the live site.
# Pull requests run the tests too, but never deploy.
#
# A merge to main, once all three test suites pass, is a release:
#
#   1. tag    - tool/next_version.dart picks the next semantic version from the
#               commits since the last v* tag (feat → minor, fix and the rest →
#               patch, `!` or BREAKING CHANGE → major), and the commit is tagged
#               v<version> first, so everything after is built from the tag;
#   2. build  - the web app and the macOS app (Life-with-AI.dmg), both from the
#               tag, with the version and commit compiled in;
#   3. deploy - the web app to Pages;
#   4. publish- the GitHub Release: notes (tool/release_notes.dart) linking the
#               builds, with the DMG attached, so
#               …/releases/latest/download/Life-with-AI.dmg is always the newest;
#   5. smoke  - the live site, checked from outside (tool/smoke_live.sh).
#
# If a build or the deploy fails, the tag stays: "Re-run failed jobs" retries
# the same version, and a full re-run finds the tag and publishes it once
# everything passes. A number is only ever skipped, never reused.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.5

jobs:
  unit:
    name: Unit and widget tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # The event collector (analytics/), a Cloudflare Worker: plain Node, no dependencies.
      - run: node --test analytics/test/*.test.js # the files: Node 22 no longer expands a folder

  integration:
    name: Integration tests (macOS app)
    # The real app end to end: Metal shaders, isolate, storage, clipboard.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test integration_test -d macos

  web:
    name: Web tests (Chrome)
    # The web build in a real browser: page address, browser downloads, Mac
    # detection, shaders under the browser's renderer. Everything else runs the
    # macOS app above. The runner comes with Chrome and a matching ChromeDriver.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: |
          "$CHROMEWEBDRIVER/chromedriver" --port=4444 > chromedriver.log 2>&1 &
          for _ in $(seq 1 20); do curl -fs http://localhost:4444/status >/dev/null && exit 0; sleep 0.5; done
          cat chromedriver.log; exit 1
      - run: >-
          flutter drive --release -d web-server --browser-name=chrome
          --driver=test_driver/integration_test.dart
          --target=integration_test/web_flows.dart

  version:
    name: Tag the release
    needs: [unit, integration, web]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the tag
    outputs:
      version: ${{ steps.tag.outputs.version }}
      commit: ${{ steps.tag.outputs.commit }}
      # "true" when v<version> is tagged on this commit and has no GitHub
      # Release yet: build it, publish it. (A re-run with nothing new: false.)
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every commit and tag since the last release
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Plain `dart`, not `dart run`, which prints build progress into the output.
          next="$(dart tool/next_version.dart)"
          echo "$next"
          version="$(sed -n 's/^version=//p' <<<"$next")"
          tag="v$version"
          if [ "$(sed -n 's/^tag=//p' <<<"$next")" = true ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "$tag" "$GITHUB_SHA"
            git push origin "$tag"
            echo "Tagged $GITHUB_SHA as $tag"
          fi
          publish=false
          if [ "$(git rev-parse "$tag^{commit}" 2>/dev/null)" = "$GITHUB_SHA" ] && ! gh release view "$tag" >/dev/null 2>&1; then
            publish=true
          fi
          {
            echo "version=$version"
            echo "commit=$(git rev-parse --short=7 "$GITHUB_SHA")"
            echo "publish=$publish"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build web
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }} # built from the tag
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Pages serves the site from /<repo>/, so assets must resolve under that path.
      - run: >-
          flutter build web --release --base-href /life-with-ai/
          --build-name=${{ needs.version.outputs.version }}
          --build-number=${{ github.run_number }}
          --dart-define=APP_VERSION=${{ needs.version.outputs.version }}
          --dart-define=APP_COMMIT=${{ needs.version.outputs.commit }}
          --dart-define=TELEMETRY_URL=${{ vars.TELEMETRY_URL }}
      # Cloudflare Web Analytics, on the live site only (local builds never
      # count). The token is public by design: it's in every page's source.
      - env:
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
        run: |
          if [ -z "$CF_BEACON_TOKEN" ]; then
            echo "::warning::CF_BEACON_TOKEN is not set; deploying without analytics."
            exit 0
          fi
          case "$CF_BEACON_TOKEN" in *[!A-Za-z0-9]*) echo "::error::CF_BEACON_TOKEN should be letters and digits only."; exit 1;; esac
          # Cloudflare's own snippet, with "spa": false: its single-page-app mode
          # counts every address change as a page view, and Flutter makes a few
          # while starting, so one visit read as ~2.4 page views. (It never sends
          # the #fragment either way: share links' seeds stay out of analytics.)
          beacon="<script type=\"module\" src=\"https://static.cloudflareinsights.com/beacon.min.js\" data-cf-beacon='{\"token\": \"$CF_BEACON_TOKEN\", \"spa\": false}'></script>"
          python3 - "$beacon" <<'PY'
          import re, sys
          path = 'build/web/index.html'
          html = open(path).read()
          new, n = re.subn(r'  <!-- ANALYTICS:.*?-->', '  ' + sys.argv[1], html, flags=re.S)
          assert n == 1, 'the ANALYTICS placeholder is missing from web/index.html'
          open(path, 'w').write(new)
          PY
          grep -c cloudflareinsights build/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  macos:
    name: Build the macOS app
    needs: [unit, integration, web, version]
    # Pull requests build it too, so a broken DMG shows up before merging; only
    # releases ship one. (`!cancelled()` lets it run on PRs, where `version` is skipped.)
    if: >-
      !cancelled() && needs.unit.result == 'success' && needs.integration.result == 'success'
      && needs.web.result == 'success'
      && (github.event_name == 'pull_request' || needs.version.outputs.publish == 'true')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # From the tag when releasing; the PR's own commit otherwise.
          ref: ${{ needs.version.outputs.version && format('v{0}', needs.version.outputs.version) || '' }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # A universal (Apple silicon + Intel) app, carrying the same version and
      # commit as the web build. Ad-hoc signed only: no Developer ID yet.
      - run: >-
          flutter build macos --release
          --build-name=${{ needs.version.outputs.version || '0.0.0' }}
          --build-number=${{ github.run_number }}
          --dart-define=APP_VERSION=${{ needs.version.outputs.version }}
          --dart-define=APP_COMMIT=${{ needs.version.outputs.commit }}
          --dart-define=TELEMETRY_URL=${{ vars.TELEMETRY_URL }}
      - run: tool/make_dmg.sh "build/macos/Build/Products/Release/Life with AI.app" Life-with-AI.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: Life-with-AI.dmg
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish the release
    # Last: once the web app is live and the DMG is built, the release links
    # both, and the download link works the moment the release exists.
    needs: [version, deploy, macos]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
          fetch-depth: 0 # the notes cover every commit since the last release
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Notes linking the builds, then the commits grouped by kind
      # (tool/release_notes.dart), under the version's hand-written intro in
      # .github/releases/ when there is one.
      - run: dart tool/release_notes.dart "${{ needs.version.outputs.version }}" > notes.md
      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v${{ needs.version.outputs.version }}"
          --repo "${{ github.repository }}"
          --verify-tag
          --title "v${{ needs.version.outputs.version }}"
          --notes-file notes.md
          Life-with-AI.dmg

  smoke:
    name: Check the live site
    # After every deploy, from the outside: the site serves this build, with the
    # analytics beacon; after a release, its page and the macOS download work.
    needs: [version, deploy, release]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          tool/smoke_live.sh "${{ needs.version.outputs.commit }}"
          "${{ needs.version.outputs.version }}" "${{ needs.release.result == 'success' }}"
